<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
  <meta name="description" content="Personal drum practice front page" />
  <title>Drum Front</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23120e0b'/%3E%3Ccircle cx='32' cy='34' r='16' fill='none' stroke='%23e0b15a' stroke-width='3'/%3E%3Ccircle cx='32' cy='34' r='5' fill='%23c17a3a'/%3E%3Cpath d='M18 18h28' stroke='%23e0b15a' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #120e0b;
      --bg-raise: #1a1510;
      --bg-card: #231c16;
      --bg-card-hover: #2c241c;
      --line: #3d3024;
      --gold: #e0b15a;
      --gold-dim: #a67c35;
      --copper: #c17a3a;
      --cream: #f4ead8;
      --muted: #b9a894;
      --faint: #8a7a68;
      --beginner: #8fca7d;
      --intermediate: #e0b15a;
      --advanced: #d07a58;
      --intro: #7eb8c9;
      --shadow: 0 1px 0 rgba(224,177,90,.08);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--cream);
      font: 14px/1.45 "Segoe UI", "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
    }
    body {
      max-width: 28rem;
      margin: 0 auto;
      min-height: 100vh;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(224,177,90,.07), transparent 180px),
        var(--bg);
    }
    a { color: var(--gold); }
    header.top {
      position: sticky; top: 0; z-index: 20;
      background: rgba(18,14,11,.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      padding: 12px 14px 10px;
    }
    .brand {
      display: flex; align-items: baseline; gap: 8px;
      margin: 0 0 8px;
    }
    .brand h1 {
      font-size: 1.35rem; font-weight: 700; letter-spacing: .04em;
      margin: 0; color: var(--gold);
      text-transform: uppercase;
    }
    .brand span { color: var(--faint); font-size: .75rem; }
    #q {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--line);
      color: var(--cream);
      border-radius: 8px;
      padding: 9px 12px;
      font: inherit;
      outline: none;
    }
    #q:focus { border-color: var(--gold-dim); box-shadow: 0 0 0 2px rgba(224,177,90,.2); }
    #q::placeholder { color: var(--faint); }
    .filters {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: 8px;
    }
    .filters button, .filters select {
      background: var(--bg-card);
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 999px;
      padding: 4px 10px;
      font: 12px/1.3 inherit;
      cursor: pointer;
    }
    .filters select { padding: 4px 8px; max-width: 11rem; }
    .filters button.on, .filters button:focus-visible {
      background: #3a2c18;
      border-color: var(--gold-dim);
      color: var(--gold);
    }
    main { padding: 10px 14px 48px; }
    .meta {
      color: var(--faint); font-size: .75rem; margin: 0 0 12px;
    }
    section.block { margin: 0 0 14px; }
    section.block > h2, details.block > summary h2 {
      margin: 0; font-size: .82rem; letter-spacing: .08em;
      text-transform: uppercase; color: var(--gold);
    }
    details.block {
      margin: 0 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg-raise);
      overflow: hidden;
    }
    details.block > summary {
      list-style: none;
      cursor: pointer;
      padding: 9px 12px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid transparent;
    }
    details.block[open] > summary { border-bottom-color: var(--line); }
    details.block > summary::-webkit-details-marker { display: none; }
    .count {
      color: var(--faint); font-size: .75rem; font-weight: 600;
      background: var(--bg-card); border-radius: 999px; padding: 1px 8px;
    }
    .group-label {
      font-size: .72rem; letter-spacing: .06em; text-transform: uppercase;
      color: var(--copper); padding: 8px 12px 4px; margin: 0;
    }
    .row {
      display: block;
      padding: 8px 12px;
      border-top: 1px solid rgba(61,48,36,.6);
      text-decoration: none;
      color: inherit;
    }
    .row:first-child { border-top: 0; }
    .row:hover, .row:focus-visible {
      background: var(--bg-card-hover);
      outline: none;
    }
    .row .t {
      display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    }
    .row .title { font-weight: 650; color: var(--cream); }
    .row .artist { color: var(--muted); font-size: .86rem; margin-top: 1px; }
    .row .reason { color: var(--faint); font-size: .78rem; margin-top: 3px; }
    .row .note { color: var(--gold-dim); font-size: .72rem; margin-top: 2px; }
    .badges { display: flex; gap: 4px; flex-shrink: 0; }
    .lvl, .site, .gen {
      font-size: .65rem; letter-spacing: .04em; text-transform: uppercase;
      border-radius: 999px; padding: 2px 6px; white-space: nowrap;
      border: 1px solid var(--line); color: var(--muted);
    }
    .lvl.Beginner, .lvl.Introductory { color: var(--beginner); border-color: #2e4a28; }
    .lvl.Intermediate { color: var(--intermediate); border-color: #5a4620; }
    .lvl.Advanced, .lvl.Expert { color: var(--advanced); border-color: #5a3228; }
    .site.musora { color: #d4a373; }
    .site.songsterr { color: #9eb3c9; }
    .empty {
      color: var(--faint); text-align: center; padding: 24px 12px; font-size: .9rem;
    }
    .playlist-link {
      display: inline-block; margin: 0 12px 8px;
      font-size: .75rem; color: var(--gold-dim);
    }
    footer {
      color: var(--faint); font-size: .7rem; text-align: center;
      padding: 8px 14px 20px;
    }
    @media (min-width: 900px) {
      /* Still a narrow column when the window is a side pane or stretched */
      body { max-width: 28rem; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Drum Front</h1>
      <span>practice desk</span>
    </div>
    <label class="sr-only" for="q" style="position:absolute;left:-9999px">Search songs</label>
    <input id="q" type="search" placeholder="Search title, artist, playlist…" autocomplete="off" />
    <div class="filters" id="filters">
      <button type="button" data-site="all" class="on">All</button>
      <button type="button" data-site="new">New for you</button>
      <button type="button" data-site="musora">Musora</button>
      <button type="button" data-site="songsterr">Songsterr</button>
      <select id="level" aria-label="Level">
        <option value="all">All levels</option>
        <option value="Beginner">Beginner</option>
        <option value="Intermediate">Intermediate</option>
        <option value="Advanced">Advanced</option>
      </select>
      <select id="genre" aria-label="Genre">
        <option value="all">All genres</option>
      </select>
    </div>
  </header>
  <main>
    <p class="meta" id="meta"></p>
    <div id="app"></div>
    <p class="empty" id="empty" hidden>No songs match that filter.</p>
  </main>
  <footer>Private practice page · not listed in search · links open in a new tab</footer>
  <script src="data.js"></script>
  <script>
    const D = window.DRUM_DATA;
    const app = document.getElementById('app');
    const empty = document.getElementById('empty');
    const q = document.getElementById('q');
    const levelSel = document.getElementById('level');
    const genreSel = document.getElementById('genre');
    let site = 'all';

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function badges(item) {
      let html = '<span class="badges">';
      if (item.level) html += `<span class="lvl ${esc(item.level)}">${esc(item.level)}</span>`;
      if (item.site) html += `<span class="site ${esc(item.site)}">${esc(item.site)}</span>`;
      html += '</span>';
      return html;
    }
    function row(item, extra) {
      const href = item.url || '#';
      const reason = item.reason ? `<div class="reason">${esc(item.reason)}</div>` : '';
      const note = item.note ? `<div class="note">${esc(item.note)}</div>` : '';
      const date = item.date ? `<div class="note">${esc(item.date)}</div>` : '';
      return `<a class="row" href="${esc(href)}" target="_blank" rel="noopener noreferrer"
        data-site="${esc(item.site || '')}" data-level="${esc(item.level || '')}" data-genre="${esc(item.genre || '')}"
        data-text="${esc((item.title+' '+item.artist+' '+(item.group||'')+' '+(item.reason||'')+' '+(item.note||'')).toLowerCase())}">
        <div class="t"><span class="title">${esc(item.title)}</span>${badges(item)}</div>
        <div class="artist">${esc(item.artist)}${extra ? ' · '+esc(extra) : ''}</div>
        ${reason}${note}${date}
      </a>`;
    }

    function collectGenres() {
      const set = new Set();
      (D.recommendations || []).forEach(x => x.genre && set.add(x.genre));
      (D.musoraHistory || []).forEach(x => x.genre && set.add(x.genre));
      (D.musoraPlaylists || []).forEach(p => p.items.forEach(x => x.genre && set.add(x.genre)));
      (D.songsterr || []).forEach(x => x.genre && set.add(x.genre));
      [...set].sort().forEach(g => {
        const o = document.createElement('option');
        o.value = g; o.textContent = g;
        genreSel.appendChild(o);
      });
    }

    function build() {
      const recGroups = {};
      (D.recommendations || []).forEach(r => {
        (recGroups[r.group] ||= []).push(r);
      });
      let recHtml = '';
      Object.keys(recGroups).forEach(g => {
        recHtml += `<p class="group-label">${esc(g)}</p>` + recGroups[g].map(r => row(r)).join('');
      });

      let histHtml = (D.musoraHistory || []).map(h => row(h)).join('');

      let plHtml = (D.musoraPlaylists || []).map(pl => {
        const open = /practice|floyd/i.test(pl.name) ? ' open' : '';
        const items = pl.items.map(it => row(it)).join('');
        return `<details class="block" data-section="musora"${open}>
          <summary><h2>${esc(pl.name.replace(/ \(Duplicate\)$/, ''))}</h2><span class="count">${pl.items.length}</span></summary>
          <a class="playlist-link" href="${esc(pl.url)}" target="_blank" rel="noopener noreferrer">Open playlist on Musora ↗</a>
          ${items}
        </details>`;
      }).join('');

      const ssByGenre = {};
      (D.songsterr || []).forEach(s => {
        const g = s.genre || 'Other';
        (ssByGenre[g] ||= []).push(s);
      });
      const ssOrder = ['Country','90s alt / grunge','Prog / Floyd','Metal / hard rock','Classic rock','80s / pop-rock','Soul / R&B / funk','Pop grooves','Holiday','Other'];
      let ssHtml = ssOrder.filter(g => ssByGenre[g]).map(g => {
        return `<p class="group-label">${esc(g)}</p>` + ssByGenre[g].map(s => row(s)).join('');
      }).join('');

      const recCount = (D.recommendations || []).length;
      const prac = (D.musoraPlaylists || []).find(p => /practice/i.test(p.name));
      const ssCount = (D.songsterr || []).length;

      app.innerHTML = `
        <details class="block" data-section="new" open>
          <summary><h2>New for you</h2><span class="count">${recCount}</span></summary>
          ${recHtml}
        </details>
        <details class="block" data-section="musora" open>
          <summary><h2>Recent on Musora</h2><span class="count">${(D.musoraHistory||[]).length}</span></summary>
          ${histHtml}
        </details>
        ${plHtml}
        <details class="block" data-section="songsterr" open>
          <summary><h2>Songsterr favorites</h2><span class="count">${ssCount}</span></summary>
          ${ssHtml}
        </details>
      `;

      const pracN = prac ? prac.items.length : 0;
      document.getElementById('meta').textContent =
        `${recCount} new · ${pracN} on the Practice playlist · ${ssCount} Songsterr favorites · updated ${D.generatedAt} (Eastern)`;
    }

    function applyFilter() {
      const query = q.value.trim().toLowerCase();
      const lvl = levelSel.value;
      const gen = genreSel.value;
      let shown = 0, total = 0;
      app.querySelectorAll('.row').forEach(el => {
        total++;
        const okSite = site === 'all'
          || (site === 'new' && el.closest('[data-section="new"]'))
          || (site !== 'new' && (el.dataset.site === site));
        const okLvl = lvl === 'all' || el.dataset.level === lvl
          || (lvl === 'Beginner' && el.dataset.level === 'Introductory');
        const okGen = gen === 'all' || el.dataset.genre === gen;
        const okQ = !query || (el.dataset.text || '').includes(query);
        const on = okSite && okLvl && okGen && okQ;
        el.hidden = !on;
        if (on) shown++;
      });
      // Hide empty group labels and sections
      app.querySelectorAll('.group-label').forEach(lab => {
        let n = lab.nextElementSibling, any = false;
        while (n && !n.classList.contains('group-label') && n.tagName !== 'DETAILS') {
          if (n.classList.contains('row') && !n.hidden) any = true;
          n = n.nextElementSibling;
        }
        lab.hidden = !any;
      });
      app.querySelectorAll('details.block').forEach(sec => {
        const siteOk = site === 'all'
          || (site === 'new' && sec.dataset.section === 'new')
          || (site === 'musora' && sec.dataset.section === 'musora')
          || (site === 'songsterr' && sec.dataset.section === 'songsterr');
        const any = [...sec.querySelectorAll('.row')].some(r => !r.hidden);
        sec.hidden = !siteOk || !any;
      });
      empty.hidden = shown > 0;
    }

    document.getElementById('filters').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-site]');
      if (!btn) return;
      site = btn.dataset.site;
      document.querySelectorAll('.filters button[data-site]').forEach(b => b.classList.toggle('on', b === btn));
      applyFilter();
    });
    q.addEventListener('input', applyFilter);
    levelSel.addEventListener('change', applyFilter);
    genreSel.addEventListener('change', applyFilter);

    if (!D) {
      app.innerHTML = '<p class="empty">Missing data.js</p>';
    } else {
      collectGenres();
      build();
      applyFilter();
    }
  </script>
</body>
</html>
